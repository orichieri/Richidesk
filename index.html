<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmaderm - Abertura de Chamado</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-brand">
      <div class="logo-icone">🛠️</div>
      <div>
        <h1>Farmaderm Help Desk</h1>
        <div class="subtitulo">Suporte técnico interno</div>
      </div>
    </div>
    <a href="admin/login.html">Área da TI →</a>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="icone-grande">📩</div>
        <h2>Abrir novo chamado</h2>
      </div>
      <p class="subtexto">
        Preencha os dados abaixo e nossa equipe de TI vai te atender o quanto antes.
        Já tem um chamado aberto? <a href="consulta.html" style="color: var(--cor-primaria); font-weight:600;">Consulte o status aqui</a>.
      </p>

      <form id="form-chamado">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" required maxlength="100" placeholder="Ex: Maria Silva">

        <label for="setor">Setor</label>
        <input type="text" id="setor" required maxlength="60" placeholder="Ex: Produção, Financeiro, Comercial...">

        <label for="descricao">Descreva o problema</label>
        <textarea id="descricao" required maxlength="2000" placeholder="Explique com detalhes o que está acontecendo..."></textarea>

        <label>Nível de urgência</label>
        <div class="prioridade-opcoes">
          <div class="prioridade-opcao critico">
            <input type="radio" name="prioridade" id="p-critico" value="critico">
            <label for="p-critico">
              <span class="emoji">🔴</span>
              Crítico<br>Máquina parada
            </label>
          </div>
          <div class="prioridade-opcao normal">
            <input type="radio" name="prioridade" id="p-normal" value="normal" checked>
            <label for="p-normal">
              <span class="emoji">🟡</span>
              Normal
            </label>
          </div>
          <div class="prioridade-opcao baixo">
            <input type="radio" name="prioridade" id="p-baixo" value="baixo">
            <label for="p-baixo">
              <span class="emoji">🟢</span>
              Baixa<br>Sem urgência
            </label>
          </div>
        </div>

        <button type="submit" class="btn" id="btn-enviar">Abrir chamado</button>

        <div id="mensagem" class="msg"></div>
      </form>
    </div>

    <p class="rodape-nota">Farmaderm &copy; Sistema interno de suporte técnico</p>
  </div>

  <!-- Biblioteca oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/novo-chamado.js"></script>

</body>
</html>
